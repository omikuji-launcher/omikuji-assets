schema_version = 2
id = "hoyoverse.genshin"
game_slug = "genshin"
display_name = "Genshin Impact"
publisher = "HoYoverse"
category = "HoYoverse"
app_id_prefix = "genshin"
letter_fallback = "G"

install_strategy = "hoyo_sophon"
uses_temp_dir = false
install_folder_name = "Genshin Impact"
default_library_template = "{home}/Games/HoYo"

voice_dir = "StreamingAssets/AudioAssets"
voice_locales = [
    { id = "en-us", label = "English", short = "EN", folder_name = "English(US)" },
    { id = "ja-jp", label = "Japanese", short = "JP", folder_name = "Japanese" },
    { id = "ko-kr", label = "Korean", short = "KR", folder_name = "Korean" },
    { id = "zh-cn", label = "Chinese", short = "CN", folder_name = "Chinese" },
]

anti_cheat = "miHoYoProtect"
telemetry_block = [
    "log-upload-os.hoyoverse.com",
    "overseauspider.yuanshen.com",
    "sg-public-data-api.hoyoverse.com",
]

[[editions]]
id = "global"
label = "Global"
exe_name = "GenshinImpact.exe"
data_folder = "GenshinImpact_Data"
strategy_config = { biz_id = "gopR6Cufr3" }

[[editions]]
id = "china"
label = "China"
exe_name = "YuanShen.exe"
data_folder = "YuanShen_Data"
strategy_config = { biz_id = "1Z8W5NHUQb" }

[[options]]
id = "fpsunlock"
label = "FPS Unlocker"

[options.companion]
name = "fpsunlock"
repo = "https://codeberg.org/mkrsym1/fpsunlock"
exe = "fpsunlock.exe"
args = ["120"]
when = "after"
delay = 5

[[options]]
id = "timeout_fix"
label = "Timeout fix"
description = "Try enabling this if your game crashes on boot"
at_install = false
env = { WINE_ENABLE_TIMEOUT_FIX = "1", UMU_USE_STEAM = "1" }

schema_version = 2
id = "hoyoverse.zzz"
game_slug = "zzz"
display_name = "Zenless Zone Zero"
publisher = "HoYoverse"
category = "HoYoverse"
app_id_prefix = "zzz"
letter_fallback = "Z"

install_strategy = "hoyo_sophon"
uses_temp_dir = false
install_folder_name = "Zenless Zone Zero"
default_library_template = "{home}/Games/HoYo"
exe_name = "ZenlessZoneZero.exe"
data_folder = "ZenlessZoneZero_Data"

voice_dir = "StreamingAssets/Audio/Windows/Full"
voice_locales = [
    { id = "en-us", label = "English", short = "EN", folder_name = "En" },
    { id = "ja-jp", label = "Japanese", short = "JP", folder_name = "Jp" },
    { id = "ko-kr", label = "Korean", short = "KR", folder_name = "Kr" },
    { id = "zh-cn", label = "Chinese", short = "CN", folder_name = "Cn" },
]

anti_cheat = "miHoYoProtect"
telemetry_block = [
    "zzz-log-upload-os.hoyoverse.com",
    "log-upload-os.hoyoverse.com",
    "sg-public-data-api.hoyoverse.com",
]

[[editions]]
id = "global"
label = "Global"
strategy_config = { biz_id = "U5hbdsT9W7" }

[[editions]]
id = "china"
label = "China"
strategy_config = { biz_id = "x6znKlJ0xK" }

[[options]]
id = "dx12"
label = "DirectX 12"
description = "Enables DX12 support"
args = ["-use-d3d12"]

[[options]]
id = "timeout_fix"
label = "Timeout fix"
description = "Try enabling this if your game crashes on boot"
at_install = false
env = { WINE_ENABLE_TIMEOUT_FIX = "1", UMU_USE_STEAM = "1" }
